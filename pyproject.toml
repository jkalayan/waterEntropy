[build-system]
# Build the package with [flit](https://flit.readthedocs.io)
requires = ["flit_core >=4,<5"]
build-backend = "flit_core.buildapi"

[project]
# See https://www.python.org/dev/peps/pep-0621/
name = "waterEntropy"
dynamic = ["version"]
description = "waterEntropy is a Python package for calculating interfacial water entropy from molecular dynamics simulations."
authors = [
    {name = "Harry Swift", email = "harry.swift@stfc.ac.uk"},
    {name = "James Gebbie-Rayet", email = "james.gebbie@stfc.ac.uk"},
    {name = "Jas Kalayan", email = "jas.kalayan@stfc.ac.uk"},
]
maintainers = [
    {name = "Jas Kalayan", email = "jas.kalayan@stfc.ac.uk"},
]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Development Status :: 5 - Production/Stable"
]
keywords = ["entropy", "macromolecular systems", "MD simulation"]
requires-python = ">=3.12"
dependencies = [
    "mdanalysis>=2.11.0,<3.0",
    "numpy>=2.3.5,<2.6.0",
    "distributed>=2025.7.0,<2027.1.0",
    "dask>=2025.7.0,<2027.1.0",
    "dask-jobqueue>=0.9.0,<1.0",
    "psutil>=7.1.3,<8.0",
]

[project.urls]
Repository = "https://github.com/jkalayan/waterEntropy"
Documentation = "https://waterEntropy.readthedocs.io"

[project.optional-dependencies]
testing = [
    "pytest>=9.0,<9.2",
    "pytest-cov>=7.0,<8.0",
    "pytest-sugar>=1.1,<2.0",
]
pre-commit = [
    "pre-commit>=3.5.0,<5.0",
    "ruff>=0.15.2,<1.0",
    "pylint>=3.0.0,<5.0",
    "rstcheck>=6.2,<7.0"
]
docs = [
    "sphinx>=8.0.0,<10.0",
    "sphinx-autoapi>=3.8,<4.0",
    "ccpbiosim-sphinx-theme>=1.3.0,<1.4.0",
    "markupsafe>=3.0,<4.0"
]

[project.scripts]
waterEntropy = "waterEntropy.cli.runWaterEntropy:main"
waterShells = "waterEntropy.cli.run_find_Nc:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

addopts = "-vv -ra"

markers = [
  "regression: end-to-end regression tests against baselines",
  "slow: long-running regression tests (20-30+ minutes)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
